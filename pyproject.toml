[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "design-flow-system"
version = "0.2.0"
description = "A PSG-linked, owner-authoritative design-governance foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
design-flow-demo = "design_flow.demo:main"
design-flow = "design_flow.runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
